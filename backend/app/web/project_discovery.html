<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="/study/projects/assets/project_training.css">

  <header class="topbar"><div><strong>OfferPilot</strong><span>项目代码分析</span></div><nav><a href="/study/knowledge">八股训练</a><a class="active" href="/study/projects">项目训练</a></nav></header>
