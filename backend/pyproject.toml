[project]
name = "offerpilot-backend"
version = "0.1.0"
description = "Backend service for OfferPilot, a Feishu-based job search preparation agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "langgraph>=0.6.0",
    "mcp>=1.12.0,<2.0.0",
    "qdrant-client[fastembed]>=1.15.0,<2.0.0",
    "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
